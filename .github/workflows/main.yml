name: Build & Release APK per Branch

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APKs
        run: ./gradlew testDebugUnitTest assembleRelease assembleDebug

      - name: Prepare, Sign or Fallback APK
        id: sign_step
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          
          # 1. Trova l'APK di release compilato da Gradle
          ORIGINAL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "❌ Errore: nessun APK trovato in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "APK trovato: $ORIGINAL_APK"

          # 2. Individua i build-tools di Android in modo robusto
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_VERSION=$(ls "$SDK_ROOT/build-tools" | sort -V | tail -n 1)
          BUILD_TOOLS_PATH="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
          echo "Build Tools Path: $BUILD_TOOLS_PATH"

          # Pulisci il nome del branch per usarlo nel nome file (es. feature/test -> feature-test)
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          SIGNED_APK_NAME="InstaEclipse-${SAFE_BRANCH}-build${{ github.run_number }}-signed.apk"
          UNSIGNED_APK_NAME="InstaEclipse-${SAFE_BRANCH}-build${{ github.run_number }}-unsigned.apk"

          # 3. Procedura di firma con gestione Fallback
          SIGN_SUCCESS=false

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Tentativo di firma con Keystore dai Secrets..."
            if echo "$KEYSTORE_BASE64" | base64 -d > release.keystore 2>/dev/null; then
              if "$BUILD_TOOLS_PATH/zipalign" -v -p 4 "$ORIGINAL_APK" aligned.apk 2>/dev/null; then
                if "$BUILD_TOOLS_PATH/apksigner" sign \
                  --ks release.keystore \
                  --ks-pass "pass:$KEYSTORE_PASSWORD" \
                  --ks-key-alias "$KEY_ALIAS" \
                  --key-pass "pass:$KEY_PASSWORD" \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  --out "$SIGNED_APK_NAME" \
                  aligned.apk 2>/dev/null; then
                  
                  if "$BUILD_TOOLS_PATH/apksigner" verify "$SIGNED_APK_NAME" 2>/dev/null; then
                    echo "✅ APK firmato con successo tramite Secrets!"
                    SIGN_SUCCESS=true
                  fi
                fi
              fi
            fi
            rm -f release.keystore aligned.apk
          else
            echo "⚠️ Secrets di firma incompleti o non impostati. Si prova fallback con chiave generata..."
            if keytool -genkeypair -v \
              -keystore fallback.keystore \
              -alias instaeclipse \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=InstaEclipse, OU=Dev, O=InstaEclipse, L=Rome, ST=RM, C=IT" 2>/dev/null; then
              
              if "$BUILD_TOOLS_PATH/zipalign" -v -p 4 "$ORIGINAL_APK" aligned.apk 2>/dev/null; then
                if "$BUILD_TOOLS_PATH/apksigner" sign \
                  --ks fallback.keystore \
                  --ks-pass "pass:android" \
                  --ks-key-alias "instaeclipse" \
                  --key-pass "pass:android" \
                  --v1-signing-enabled true \
                  --v2-signing-enabled true \
                  --v3-signing-enabled true \
                  --out "$SIGNED_APK_NAME" \
                  aligned.apk 2>/dev/null; then
                  
                  if "$BUILD_TOOLS_PATH/apksigner" verify "$SIGNED_APK_NAME" 2>/dev/null; then
                    echo "✅ APK firmato con successo tramite Keystore locale/fallback!"
                    SIGN_SUCCESS=true
                  fi
                fi
              fi
              rm -f fallback.keystore aligned.apk
            fi
          fi

          # 4. Fallback finale se la firma fallisce per qualsiasi motivo
          if [ "$SIGN_SUCCESS" = true ]; then
            echo "RELEASE_FILE=$SIGNED_APK_NAME" >> $GITHUB_ENV
            echo "RELEASE_STATUS=Firmato" >> $GITHUB_ENV
          else
            echo "⚠️ Errore o login mancante nella procedura di firma. Attivazione procedura di backup (APK non firmato)..."
            cp "$ORIGINAL_APK" "$UNSIGNED_APK_NAME"
            echo "RELEASE_FILE=$UNSIGNED_APK_NAME" >> $GITHUB_ENV
            echo "RELEASE_STATUS=Non firmato (Fallback attivo)" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.ref_name }}-build${{ github.run_number }}
          name: "InstaEclipse [${{ github.ref_name }}] - Build #${{ github.run_number }}"
          body: |
            ### Dettagli Build
            - **Branch:** `${{ github.ref_name }}`
            - **Stato Firma:** **${{ env.RELEASE_STATUS }}**
            - **Commit SHA:** `${{ github.sha }}`
            - **Autore:** @${{ github.actor }}
          files: |
            ${{ env.RELEASE_FILE }}
          prerelease: false
          generate_release_notes: true
