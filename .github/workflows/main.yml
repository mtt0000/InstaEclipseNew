name: Build & Release Signed APK per Branch

on:
  push:
    branches:
      - "**" # Esegue il workflow per qualsiasi branch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build APKs
        run: ./gradlew testDebugUnitTest assembleRelease assembleDebug

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          SIGNED_READY_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)

          if [ -n "$SIGNED_READY_APK" ]; then
            cp "$SIGNED_READY_APK" InstaEclipse-signed.apk
          else
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
              KS_PASS="$KEYSTORE_PASSWORD"
              K_ALIAS="$KEY_ALIAS"
              K_PASS="$KEY_PASSWORD"
            else
              echo "⚠️ Nessun keystore nei Secrets trovato. Generazione di un keystore temporaneo..."
              keytool -genkeypair -v \
                -keystore release.keystore \
                -alias instaeclipse \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=InstaEclipse, OU=Dev, O=InstaEclipse, L=Rome, S=RM, C=IT"
              KS_PASS="android"
              K_ALIAS="instaeclipse"
              K_PASS="android"
            fi

            BUILD_TOOLS_DIR=$(ls -d$ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$KS_PASS" \
              --ks-key-alias "$K_ALIAS" \
              --key-pass "pass:$K_PASS" \
              --out InstaEclipse-signed.apk \
              aligned.apk
            rm -f release.keystore aligned.apk
          fi

          # Rinomina l'APK includendo il nome del branch sicuro per i file
          SAFE_BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          mkdir -p output_apk
          cp InstaEclipse-signed.apk output_apk/InstaEclipse-${SAFE_BRANCH_NAME}.apk

      - name: Publish to GitHub Release per Branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: branch-${{ github.ref_name }}
          name: "Release (${{ github.ref_name }})"
          body: |
            Ultimo aggiornamento automatico per il branch **`${{ github.ref_name }}`**.
            * **Commit:** `${{ github.sha }}`
            * **Autore:** @${{ github.actor }}
          files: |
            output_apk/*.apk
          prerelease: false
          # Usando make_latest: true o false decidi se sovrascrivere o meno la release principale (lasciamo gestito da softprops)
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
